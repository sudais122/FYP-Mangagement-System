<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Under Maintenance — FYP Management AWKUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #004B2D;
    --primary-dark: #003520;
    --secondary: #1F7A5C;
    --gold: #BFA14A;
    --gold-lt: #D4B85E;
    --text: #1A2A22;
    --text-mute: #6C757D;
    --surface: #FFFFFF;
    --bg: #F4F7F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--secondary) 100%);
    min-height: 100vh;
    display: grid;
    place-items: center;
    color: #fff;
    padding: 20px;
    overflow: hidden;
  }
  .container {
    max-width: 580px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .icon-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 32px;
    background: rgba(191,161,74,.18);
    border: 2px solid rgba(191,161,74,.4);
    border-radius: 30px;
    display: grid;
    place-items: center;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  .icon-wrap svg {
    width: 56px;
    height: 56px;
    color: var(--gold);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 800;
    margin-bottom: 16px;
    color: #fff;
  }
  .subtitle {
    font-size: 1.05rem;
    opacity: .9;
    line-height: 1.6;
    margin-bottom: 28px;
    color: rgba(255,255,255,.95);
  }
  .reason-box {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 28px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .reason-label {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .reason-text {
    font-size: .95rem;
    line-height: 1.5;
    color: #fff;
  }
  .timer {
    font-size: .82rem;
    color: rgba(255,255,255,.7);
    margin-bottom: 32px;
    font-weight: 500;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    font-size: .88rem;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all .2s;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--primary-dark);
  }
  .btn-primary:hover {
    background: var(--gold-lt);
  }
  .btn-ghost {
    background: rgba(255,255,255,.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,.25);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,.2);
  }
  .footer {
    margin-top: 60px;
    font-size: .72rem;
    color: rgba(255,255,255,.5);
    font-style: italic;
  }
  /* Decorative background blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 1;
    opacity: .3;
  }
  .blob.b1 {
    width: 400px; height: 400px;
    background: var(--gold);
    top: -150px; left: -150px;
  }
  .blob.b2 {
    width: 350px; height: 350px;
    background: var(--secondary);
    bottom: -120px; right: -120px;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="container">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <h1>Under Maintenance</h1>
    <p class="subtitle">
      The FYP Management System is temporarily unavailable while we make improvements.
    </p>

    <div class="reason-box">
      <div class="reason-label">Reason</div>
      <div class="reason-text" id="reason-text">
        We're upgrading the system. Please check back shortly.
      </div>
    </div>

    <div class="timer" id="timer-text">Started just now</div>
    <a href="../Client/index.html" style="text-decoration: none;">
    <div class="actions">
      <button class="btn btn-primary" onclick="checkStatus()">
        Go to Home
      </button>
    </div>
    </a>
    <div class="footer">
      © 2026 FYP Management — Abdul Wali Khan University Mardan
    </div>
  </div>

<script>
const API_BASE = "http://127.0.0.1:5001";

async function loadStatus() {
  try {
    // Try without auth first (status endpoint is open after our fix)
    const res = await fetch(`${API_BASE}/api/admin/maintenance`);
    const data = await res.json();
    if (data.maintenance_reason) {
      document.getElementById("reason-text").textContent = data.maintenance_reason;
    }
    if (data.maintenance_started_at) {
      updateTimer(new Date(data.maintenance_started_at));
    }
    // If maintenance is OFF, redirect back
    if (!data.maintenance_mode) {
      window.location.href = "../Client/index.html";
    }
  } catch (err) {
    console.warn("Could not load maintenance status:", err);
  }
}

function updateTimer(startDate) {
  function tick() {
    const now = new Date();
    const diff = Math.floor((now - startDate) / 1000);
    const mins = Math.floor(diff / 60);
    const hrs  = Math.floor(mins / 60);
    let str = "Started ";
    if (hrs > 0)      str += `${hrs}h ${mins % 60}m ago`;
    else if (mins > 0) str += `${mins} min${mins !== 1 ? "s" : ""} ago`;
    else               str += `${diff} sec${diff !== 1 ? "s" : ""} ago`;
    document.getElementById("timer-text").textContent = str;
  }
  tick();
  setInterval(tick, 30000);
}

function checkStatus() {
  loadStatus();
}

loadStatus();
// Auto-recheck every 30 seconds
setInterval(loadStatus, 30000);
</script>
</body>
</html>
