<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Security Update Required — FYP Management System</title>
  <link rel="stylesheet" href="./css/change-pasword.css">
  <link rel="stylesheet" href="../../shared/css/theme.css" />
</head>
<body>
<div class="container">
  <!-- Main Card -->
  <div class="card">
    <div class="header">
      <h1>Set New Password</h1>
      <p>Create a strong password to secure your supervisor account</p>
    </div>

    <form id="passwordForm">
      <!-- New Password Field -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="newPassword" 
            placeholder="Enter your new password"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-btn" onclick="togglePassword('newPassword', this)">
            <svg viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>

        <!-- Password Strength Indicator -->
        <div class="password-strength" id="strengthIndicator">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>

        <!-- Password Requirements -->
        <div class="requirements">
          <div class="requirements-title">Password Requirements:</div>
          <div class="requirement" id="req-length">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>At least 8 characters</span>
          </div>
          <div class="requirement" id="req-uppercase">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>One uppercase letter</span>
          </div>
          <div class="requirement" id="req-lowercase">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>One lowercase letter</span>
          </div>
          <div class="requirement" id="req-number">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>One number</span>
          </div>
          <div class="requirement" id="req-special">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>One special character (!@#$%^&*)</span>
          </div>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Re-enter your password"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)">
            <svg viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message hidden" id="errorMessage">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Set Password & Continue</span>
      </button>
    </form>
  </div>
</div>
<script src="./js/Change-Password.js"></script>
</body>
</html>
