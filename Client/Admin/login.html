<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — FYP Management AWKUM</title>
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQuS5zKV6Zvqb-Q0nuX_xm8j1-VBx2WXwSJw&s">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/theme.css" />
<link rel="stylesheet" href="./css/login.css">
</head>
<body>
<div class="bg"></div>
<div class="dot-grid"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="container">
  <a href="../index.html" style="list-style: none; text-decoration: none;">
  <div class="brand">
    <div class="brand-icon"><svg viewBox="0 0 28 28" fill="none"><path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" fill="var(--gold)" opacity=".9"/><path d="M14 7L21 11V18L14 22L7 18V11L14 7Z" fill="var(--primary-dark)"/><circle cx="14" cy="14.5" r="3" fill="var(--gold)"/></svg></div>
    <span class="brand-name">FYP Management</span>
  </div>
  </a>
  <div class="brand-sub">AWKUM · CS Department</div>

  <div class="card">

    <!-- STEP 1: LOGIN -->
    <div class="step active" id="step-login">
      <div class="form-header">
        <div class="form-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></div>
        <h2 class="form-title">Sign In</h2>
        <p class="form-subtitle">Enter your admin credentials</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group" id="grp-login-email">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            <input type="email" id="login-email" class="form-input" placeholder="admin@awkum.edu.pk" autocomplete="email">
          </div>
          <span class="form-error" id="err-login-email"></span>
        </div>
        <div class="form-group" id="grp-login-pw">
          <label class="form-label" for="login-pw">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="login-pw" class="form-input" placeholder="••••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw('login-pw',this)">
              <svg class="eye-o" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-c" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
          <span class="form-error" id="err-login-pw"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>
  </div>
  <div class="footer">© 2025 FYP Management — Abdul Wali Khan University Mardan</div>
</div>

<div class="toast" id="toast"></div>
<script src="./js/login.js"></script>
</body>
</html>
